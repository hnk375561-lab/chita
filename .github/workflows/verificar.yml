name: Verificar todo (sin hacer nada a mano)

# Gratis en repos públicos. Corre solo en cada push a main y a mano (Actions > Verificar todo > Run workflow).
# No bloquea el deploy. El informe completo queda en la rama "informes" (archivo REPORTE.md) y en Artifacts.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chita-verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base:
    name: Datos, sintaxis, enlaces, Lighthouse
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund && mkdir -p informe
      - name: Datos y consistencia (npm test)
        id: datos
        continue-on-error: true
        run: npm test 2>&1 | tee informe/datos.txt; exit ${PIPESTATUS[0]}
      - name: Sintaxis de todos los JS
        id: sintaxis
        continue-on-error: true
        run: |
          rc=0
          for f in js/*.js scripts/*.mjs; do node --check "$f" 2>&1 || { echo "FALLA: $f"; rc=1; }; done 2>&1 | tee informe/sintaxis.txt
          exit ${PIPESTATUS[0]}
      - name: Armar el sitio publicado
        id: build
        continue-on-error: true
        run: node scripts/build-site.mjs 2>&1 | tee informe/build.txt; exit ${PIPESTATUS[0]}
      - name: Enlaces internos y externos
        id: enlaces
        continue-on-error: true
        run: node scripts/check-links.mjs --external 2>&1 | tee informe/enlaces.txt; exit ${PIPESTATUS[0]}
      - name: Lighthouse movil y escritorio
        id: lighthouse
        continue-on-error: true
        run: |
          node scripts/serve-gzip.mjs _site 8080 >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/index.html >/dev/null && break; sleep 1; done
          for pagina in index reserva; do
            npx --yes lighthouse@12 http://localhost:8080/$pagina.html --quiet --output=json --output-path=informe/lh-$pagina-movil.json --chrome-flags="--headless=new --no-sandbox"
            npx --yes lighthouse@12 http://localhost:8080/$pagina.html --quiet --preset=desktop --output=json --output-path=informe/lh-$pagina-escritorio.json --chrome-flags="--headless=new --no-sandbox"
          done
          kill %1 2>/dev/null || true
      - name: Puerta de produccion (informativo, debe fallar mientras sea demo)
        run: npm run test:prod 2>&1 | tee informe/produccion.txt; true
      - name: Resultado del job
        if: always()
        run: |
          echo "datos=${{ steps.datos.outcome }}" > informe/resultado.txt
          echo "sintaxis=${{ steps.sintaxis.outcome }}" >> informe/resultado.txt
          echo "build=${{ steps.build.outcome }}" >> informe/resultado.txt
          echo "enlaces=${{ steps.enlaces.outcome }}" >> informe/resultado.txt
          echo "lighthouse=${{ steps.lighthouse.outcome }}" >> informe/resultado.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informe-base
          path: informe/
      - name: Fallar si algo fallo
        if: always()
        run: grep -q failure informe/resultado.txt && exit 1 || exit 0

  navegador:
    name: Navegador Chromium (${{ matrix.nombre }})
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nombre: escritorio, args: "--desktop" }
          - { nombre: movil, args: "--mobile" }
          - { nombre: otros-dispositivos, args: "--all-devices" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium && mkdir -p informe
      - name: Chequeo completo
        run: |
          npm run check:all -- ${{ matrix.args }} 2>&1 | tee informe/chromium-${{ matrix.nombre }}.txt; code=${PIPESTATUS[0]}
          cp -r check-report informe/capturas 2>/dev/null || true
          echo "exit=$code" > informe/resultado.txt
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informe-chromium-${{ matrix.nombre }}
          path: informe/

  safari:
    name: Safari (WebKit)
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund && npx playwright install --with-deps webkit && mkdir -p informe
      - name: Chequeo completo
        run: |
          npm run check:safari 2>&1 | tee informe/webkit.txt; code=${PIPESTATUS[0]}
          cp -r check-report informe/capturas 2>/dev/null || true
          echo "exit=$code" > informe/resultado.txt
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informe-safari
          path: informe/

  publicado:
    name: Sitio ya publicado (github.io)
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium && mkdir -p informe
      - name: Chequeo completo sobre la URL publicada
        run: |
          npm run check:all -- --url=https://hnk375561-lab.github.io/chita/ 2>&1 | tee informe/publicado.txt; code=${PIPESTATUS[0]}
          cp -r check-report informe/capturas 2>/dev/null || true
          echo "exit=$code" > informe/resultado.txt
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informe-publicado
          path: informe/

  reportar:
    name: Informe final
    needs: [base, navegador, safari, publicado]
    if: always()
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: recibido
      - name: Armar REPORTE.md y publicarlo en la rama informes
        run: |
          mkdir -p informes && cp -r recibido/* informes/ 2>/dev/null || true
          {
            echo "# Informe de verificacion"
            echo "Commit: ${{ github.sha }} · $(date -u +%F' '%T) UTC"
            echo
            echo "| Job | Resultado |"; echo "|---|---|"
            echo "| Datos, sintaxis, enlaces, Lighthouse | ${{ needs.base.result }} |"
            echo "| Chromium (escritorio, movil, otros dispositivos) | ${{ needs.navegador.result }} |"
            echo "| Safari / WebKit | ${{ needs.safari.result }} |"
            echo "| Sitio ya publicado | ${{ needs.publicado.result }} |"
            echo
            echo "## Lighthouse (0-100)"; echo
            echo "| Pagina | Rendimiento | Accesibilidad | Buenas practicas | SEO |"; echo "|---|---|---|---|---|"
            node -e '
              const fs=require("fs"),d="informes/informe-base";
              if(fs.existsSync(d)) for (const f of fs.readdirSync(d).filter(n=>/^lh-.*\.json$/.test(n))) {
                const c=JSON.parse(fs.readFileSync(d+"/"+f)).categories, s=k=>Math.round((c[k]?.score??0)*100);
                console.log("| "+f.replace(".json","").replace("lh-","")+" | "+s("performance")+" | "+s("accessibility")+" | "+s("best-practices")+" | "+s("seo")+" |");
              }' || true
            for t in informes/*/*.txt; do
              echo; echo "## $t"; echo '```'; tail -n 70 "$t"; echo '```'
            done
          } > informes/REPORTE.md
          cd informes && git init -q -b informes && git add -A
          git -c user.name="verificar" -c user.email="verificar@users.noreply.github.com" commit -q -m "Informe ${{ github.sha }}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/informes
          cat REPORTE.md >> "$GITHUB_STEP_SUMMARY"
      - name: Fallar si algun job fallo
        if: ${{ needs.base.result != 'success' || needs.navegador.result != 'success' || needs.safari.result != 'success' || needs.publicado.result != 'success' }}
        run: exit 1
