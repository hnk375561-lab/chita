# Publicar solo el sitio: los archivos internos devuelven 404
[[redirects]]
  from = "/golive/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/data/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/AUDITORIA-IMPLEMENTACION.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/AUDITORIA-CHITA-PRE-PRODUCCION.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/plan.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/manus-routes.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/LEEME*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/chita-cambios/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Caché: los archivos no llevan hash, por eso solo las fuentes (casi nunca cambian) son immutable.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
